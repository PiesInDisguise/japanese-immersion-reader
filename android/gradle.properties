org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template, defaulting to
# false. Flipping it to true fixes file_picker 11.x (whose android/
# build.gradle only applies the separate Kotlin plugin pre-AGP9, assuming
# AGP's own built-in Kotlin compiles it on AGP9+) but breaks
# audioplayers_android 5.3.0, which unconditionally applies the separate
# Kotlin plugin regardless of AGP version -- AGP9's built-in Kotlin actively
# rejects that as a conflict ("no longer required... since AGP 9.0"). Left
# false (both plugins can't be satisfied at once at this Gradle-property
# level) and file_picker is patched instead -- see
# rust/vendor/README.md's sibling note in pubspec.yaml's
# dependency_overrides for file_picker.
android.builtInKotlin=false
